name: Android APK

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Name APK
        id: apk
        run: |
          TAG="apk-$(echo "${GITHUB_REF_NAME}" | tr '/' '-')"
          FILE="FoxRadio-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: FoxRadio-debug-apk
          path: ${{ steps.apk.outputs.file }}

      - name: Publish release (one per branch, gets replaced)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.apk.outputs.tag }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "FoxRadio APK (${GITHUB_REF_NAME}, Build ${GITHUB_RUN_NUMBER})" \
            --notes "Debug-APK aus Commit ${GITHUB_SHA::7}. Am Handy öffnen, herunterladen, installieren."
